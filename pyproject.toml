[project]
name = "electiondata-mcp"
version = "0.1.0"
description = "MCP server for Malaysian election data from ElectionData.MY"
readme = "README.md"
authors = [{ name = "Azwan Zuharimi" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.*",
    "mcp==2.3.*",
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography<46.0.4; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "httpx2>=2.16",
    "pytz>=2026.6",
]

[project.scripts]
electiondata-mcp = "electiondata_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the real lake or API"]
addopts = "-m 'not live'"

[tool.pyright]
pythonVersion = "3.12"
