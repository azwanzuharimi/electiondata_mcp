name: test

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -c "import platform, duckdb, cryptography; print(platform.system(), platform.machine(), duckdb.__version__, cryptography.__version__)"
      - run: uv run pytest -q
      - run: uv run pytest -q -m live
        env:
          ELECTIONDATA_API_KEY: ${{ secrets.ELECTIONDATA_API_KEY }}

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install.sh from this commit
        if: runner.os != 'Windows'
        run: sh install.sh
        env:
          ELECTIONDATA_MCP_SOURCE: ${{ github.workspace }}
      - name: install.ps1 from this commit
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy ByPass -File install.ps1
        env:
          ELECTIONDATA_MCP_SOURCE: ${{ github.workspace }}
      - name: README one-line command (macOS, Linux)
        if: runner.os != 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -LsSf https://raw.githubusercontent.com/azwanzuharimi/electiondata_mcp/main/install.sh | sh
      - name: README one-line command (Windows)
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/azwanzuharimi/electiondata_mcp/main/install.ps1 | iex"

  image:
    needs: [test, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/azwanzuharimi/electiondata_mcp:latest
          labels: org.opencontainers.image.source=https://github.com/azwanzuharimi/electiondata_mcp
      - name: Run the image
        run: docker run --rm ghcr.io/azwanzuharimi/electiondata_mcp:latest --check
