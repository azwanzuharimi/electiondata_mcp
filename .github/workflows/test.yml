name: test

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -c "import platform, duckdb, cryptography; print(platform.system(), platform.machine(), duckdb.__version__, cryptography.__version__)"
      - run: uv run pytest -q
      - run: uv run pytest -q -m live
        env:
          ELECTIONDATA_API_KEY: ${{ secrets.ELECTIONDATA_API_KEY }}

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh from this commit
        if: runner.os != 'Windows'
        run: sh install.sh
        env:
          ELECTIONDATA_MCP_SOURCE: ${{ github.workspace }}
      - name: install.ps1 from this commit
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy ByPass -File install.ps1
        env:
          ELECTIONDATA_MCP_SOURCE: ${{ github.workspace }}
      - name: README one-line command (macOS, Linux)
        if: runner.os != 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -LsSf https://raw.githubusercontent.com/azwanzuharimi/electiondata_mcp/main/install.sh | sh
      - name: README one-line command (Windows)
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/azwanzuharimi/electiondata_mcp/main/install.ps1 | iex"

  image:
    needs: [test, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/azwanzuharimi/electiondata_mcp:latest
          labels: org.opencontainers.image.source=https://github.com/azwanzuharimi/electiondata_mcp
      - name: Run the image
        run: docker run --rm ghcr.io/azwanzuharimi/electiondata_mcp:latest --check
